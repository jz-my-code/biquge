name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app/Contents/Developer | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version & devices
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Biquge.xcodeproj -scheme Biquge || true

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Biquge.xcodeproj \
            -scheme Biquge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Locate .app
        id: findapp
        run: |
          APP_PATH=$(find build/Build/Products -name "Biquge.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Package into unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R "${{ steps.findapp.outputs.app_path }}" Payload/
          # Embed a placeholder entitlements to satisfy some sideload tools
          zip -qr Biquge-unsigned.ipa Payload
          ls -lh Biquge-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biquge-unsigned-ipa
          path: Biquge-unsigned.ipa
          if-no-files-found: error
          retention-days: 30