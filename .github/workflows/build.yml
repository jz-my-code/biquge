name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.3.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package
        run: xcodebuild -resolvePackageDependencies -project Biquge.xcodeproj -scheme Biquge

      - name: Build for iOS (no codesign)
        run: |
          set -e
          xcodebuild \
            -project Biquge.xcodeproj \
            -scheme Biquge \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA (unsigned)
        run: |
          set -e
          APP=$(find build -name "Biquge.app" -type d | head -n1)
          if [ -z "$APP" ]; then echo "Biquge.app not found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -q Biquge-unsigned.ipa Payload
          ls -lh Biquge-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biquge-unsigned-ipa
          path: Biquge-unsigned.ipa
          retention-days: 30