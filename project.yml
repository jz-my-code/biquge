name: Biquge
options:
  bundleIdPrefix: com.jzmycode
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.9"

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0

targets:
  Biquge:
    type: application
    platform: iOS
    sources:
      - Sources/Biquge
    info:
      path: Sources/Biquge/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jzmycode.biquge
      INFOPLIST_FILE: Sources/Biquge/Info.plist
    dependencies:
      - package: SwiftSoup